<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transitur - Biblia de Reservas</title>
  <meta name="description" content="Biblia de Reservas de Transitur Peru">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="canonical" href="https://transitur.pe/biblia/">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Visor a pantalla completa: el PDF se muestra aqui mismo,
       sin cambiar la URL de transitur.pe/biblia */
    #visor {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }

    /* Contenido alternativo: solo aparece si el navegador no sabe
       mostrar PDFs incrustados (p. ej. Chrome en Android) */
    .fallback {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 480px;
      width: calc(100% - 3rem);
      margin: 12vh auto 0;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .fallback h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }

    .fallback p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <object id="visor" type="application/pdf">
    <div class="fallback">
      <h1>Biblia de Reservas</h1>
      <p>Tu navegador no puede mostrar el documento incrustado. Haz clic en el botón para abrirlo o descargarlo.</p>
      <a href="biblia.pdf" class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        Abrir PDF (Biblia de Reservas)
      </a>
    </div>
  </object>
  <script>
    // Se asigna aqui, y no en el HTML, para forzar una sola carga
    // con parametro anticache y que siempre se vea la version actual.
    document.getElementById('visor').data = "biblia.pdf?v=" + Date.now();
  </script>
</body>
</html>
